
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Bootstrap Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">MySite</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="container-fluid bg-primary text-white text-center p-5">
    <h1>Welcome to My Responsive Page</h1>
    <p>Built with Bootstrap Grid System</p>
  </div>

  <!-- Content Section -->
  <div class="container my-5">
    <div class="row">
      <!-- Column 1 -->
      <div class="col-md-4 col-sm-12 mb-3">
        <div class="p-3 border bg-light">Column 1: On large screens, this takes 1/3 width. On small screens, full width.</div>
      </div>
      <!-- Column 2 -->
      <div class="col-md-4 col-sm-12 mb-3">
        <div class="p-3 border bg-light">Column 2: Same behavior as Column 1.</div>
      </div>
      <!-- Column 3 -->
      <div class="col-md-4 col-sm-12 mb-3">
        <div class="p-3 border bg-light">Column 3: Responsive layout adapts automatically.</div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center p-3">
    © 2026 MySite. All rights reserved.
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
